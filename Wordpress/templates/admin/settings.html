<!-- templates/admin/settings.html -->
{% extends "admin/base.html" %}

{% block content %}
<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0">Settings</h1>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h6 class="mb-0">General Settings</h6>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="site_title" class="form-label">Site Title</label>
                        <input type="text" class="form-control" name="site_title" 
                               value="{{ settings.get('site_title', '') }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="site_description" class="form-label">Site Description</label>
                        <textarea class="form-control" name="site_description" rows="3">{{ settings.get('site_description', '') }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="posts_per_page" class="form-label">Posts per Page</label>
                        <input type="number" class="form-control" name="posts_per_page" 
                               value="{{ settings.get('posts_per_page', '10') }}" min="1" max="50">
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" name="allow_comments" 
                                   {{ 'checked' if settings.get('allow_comments', 'true') == 'true' else '' }}>
                            <label class="form-check-label" for="allow_comments">
                                Allow Comments on Posts
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" name="comment_moderation" 
                                   {{ 'checked' if settings.get('comment_moderation', 'true') == 'true' else '' }}>
                            <label class="form-check-label" for="comment_moderation">
                                Moderate Comments Before Publishing
                            </label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
